name: Deploy React para GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: meu-projeto/package-lock.json

      - name: Instalar dependências
        working-directory: ./meu-projeto
        run: npm ci

      - name: Criar build
        working-directory: ./meu-projeto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./meu-projeto/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4